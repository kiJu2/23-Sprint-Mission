<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./index.css" />
    <title>판다마켓 | 로그인</title>
  </head>
  <body>
    <div class="auth-container">
      <a href="/">
        <img src="/images/logo.svg" alt="판다마켓 로고" class="auth-logo" />
      </a>

      <form class="auth-form" action="/">
        <div>
          <label for="email" class="text-2lg-bold secondary-800 auth-label"
            >이메일</label
          >
          <input
            id="email"
            type="email"
            name="email"
            class="input auth-input"
            placeholder="이메일을 입력해주세요."
            autocomplete="off"
            required
          />
        </div>
        <div>
          <label for="nickname" class="text-2lg-bold secondary-800 auth-label"
            >닉네임</label
          >
          <input
            id="nickname"
            class="input auth-input"
            type="text"
            name="nickname"
            placeholder="비밀번호를 입력해주세요."
            required
          />
        </div>
        <div>
          <label for="password" class="text-2lg-bold secondary-800 auth-label"
            >비밀번호</label
          >
          <input
            id="password"
            class="input auth-input"
            type="password"
            name="password"
            placeholder="비밀번호를 입력해주세요."
            required
          />
        </div>

        <div>
          <label
            for="password-confirm"
            class="text-2lg-bold secondary-800 auth-label"
            >비밀번호 확인</label
          >
          <input
            id="password-cofirm"
            class="input auth-input"
            type="text"
            name="passwordConfirm"
            placeholder="비밀번호를 입력해주세요."
            required
          />
        </div>

        <button class="btn-large" type="submit">회원가입</button>
      </form>
      <p class="text-md-medium secondary-800">
        이미 회원이신가요?
        <a href="/login" class="primary-100 underline">로그인</a>
      </p>
    </div>
  </body>
</html>
